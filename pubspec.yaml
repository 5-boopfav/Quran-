name: islamic_companion_app
description: تطبيق متكامل لمواقيت الصلاة والأذان، مصحف المدينة والختمة، حصن المسلم، أذكار الصباح والمساء، والسبحة.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  adhan: ^2.0.0+1
  geolocator: ^13.0.1
  flutter_local_notifications: ^17.2.2
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.2
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
