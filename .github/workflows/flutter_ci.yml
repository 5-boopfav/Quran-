name: Flutter CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure valid Android V2 project structure
        run: |
          if [ ! -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
            mkdir -p /tmp/android_backup
            if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
              cp android/app/src/main/AndroidManifest.xml /tmp/android_backup/AndroidManifest.xml
            fi
            rm -rf android
            flutter create . --platforms=android --org com.bahmad.quran --project-name quran_app
            if [ -f "/tmp/android_backup/AndroidManifest.xml" ]; then
              cp /tmp/android_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
            fi
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore
